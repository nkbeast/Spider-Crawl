<svg width="1200" height="360" viewBox="0 0 1200 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Spider Crawl v1.0.1 — Async Multi-Source URL Harvester">
  <defs>
    <linearGradient id="bgGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0d1117"/>
      <stop offset="55%" stop-color="#0b1420"/>
      <stop offset="100%" stop-color="#0a1a24"/>
    </linearGradient>
    <linearGradient id="titleGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#22d3ee"/>
      <stop offset="45%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#34d399"/>
    </linearGradient>
    <linearGradient id="pillGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#7c3aed"/>
      <stop offset="100%" stop-color="#2563eb"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="0%" r="90%">
      <stop offset="0%" stop-color="#164e63" stop-opacity="0.55"/>
      <stop offset="60%" stop-color="#0d1117" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge>
        <feMergeNode in="b"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <rect width="1200" height="360" fill="url(#bgGrad)"/>
  <rect width="1200" height="360" fill="url(#glow)"/>

  <!-- faint grid -->
  <g stroke="#1f2937" stroke-width="0.6" opacity="0.35">
    <path d="M0 90 H1200 M0 180 H1200 M0 270 H1200"/>
    <path d="M150 0 V360 M300 0 V360 M450 0 V360 M600 0 V360 M750 0 V360 M900 0 V360 M1050 0 V360"/>
  </g>

  <!-- spider web, top right -->
  <g transform="translate(1120,-30)" stroke="#164e63" stroke-width="1.4" fill="none" opacity="0.9">
    <g>
      <line x1="0" y1="0" x2="0" y2="330"/>
      <line x1="0" y1="0" x2="-165" y2="285"/>
      <line x1="0" y1="0" x2="-330" y2="0"/>
      <line x1="0" y1="0" x2="-165" y2="-285"/>
      <line x1="0" y1="0" x2="165" y2="285"/>
      <line x1="0" y1="0" x2="165" y2="-285"/>
    </g>
    <g opacity="0.85">
      <path d="M0 60 L52 60 L34 49 L0 88 Z" transform="rotate(15)"/>
      <path d="M0 120 L104 120 L68 99 L0 176 Z" transform="rotate(15)"/>
      <path d="M0 190 L164 190 L107 157 L0 279 Z" transform="rotate(15)"/>
      <path d="M0 260 L225 260 L146 214 L0 381 Z" transform="rotate(15)"/>
    </g>
    <g opacity="0.85">
      <path d="M0 60 L52 60 L34 49 L0 88 Z" transform="scale(-1,1) rotate(15)"/>
      <path d="M0 120 L104 120 L68 99 L0 176 Z" transform="scale(-1,1) rotate(15)"/>
      <path d="M0 190 L164 190 L107 157 L0 279 Z" transform="scale(-1,1) rotate(15)"/>
      <path d="M0 260 L225 260 L146 214 L0 381 Z" transform="scale(-1,1) rotate(15)"/>
    </g>
  </g>

  <!-- spider icon (drawn) -->
  <g transform="translate(330,150)" stroke="#22d3ee" stroke-width="3" fill="none" stroke-linecap="round" filter="url(#softGlow)">
    <ellipse cx="0" cy="0" rx="17" ry="21" fill="#0e7490" stroke="#22d3ee" stroke-width="2.5"/>
    <circle cx="0" cy="-27" r="11" fill="#0e7490" stroke="#22d3ee" stroke-width="2.5"/>
    <path d="M-12 -30 C-30 -38 -42 -30 -55 -44"/>
    <path d="M-13 -24 C-32 -26 -44 -18 -58 -26"/>
    <path d="M-13 -18 C-32 -12 -46 -2 -60 -8"/>
    <path d="M-12 -12 C-28 -2 -40 8 -52 12"/>
    <path d="M12 -30 C30 -38 42 -30 55 -44"/>
    <path d="M13 -24 C32 -26 44 -18 58 -26"/>
    <path d="M13 -18 C32 -12 46 -2 60 -8"/>
    <path d="M12 -12 C28 -2 40 8 52 12"/>
  </g>

  <!-- title -->
  <text x="620" y="185" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code','Cascadia Code',Consolas,monospace"
        font-size="86" font-weight="800" letter-spacing="6" fill="url(#titleGrad)"
        filter="url(#softGlow)">SPIDER CRAWL</text>

  <!-- subtitle -->
  <text x="620" y="232" text-anchor="middle"
        font-family="'JetBrains Mono','Fira Code',Consolas,monospace"
        font-size="21" letter-spacing="2.5" fill="#7dd3fc" opacity="0.92">Async Multi-Source URL Harvester — Recon · Bug Bounty · OSINT</text>

  <!-- version pill -->
  <g transform="translate(620,272)">
    <rect x="-58" y="-17" width="116" height="34" rx="17" fill="url(#pillGrad)" opacity="0.95"/>
    <text x="0" y="6" text-anchor="middle"
          font-family="'JetBrains Mono',Consolas,monospace"
          font-size="17" font-weight="700" fill="#ffffff" letter-spacing="1">v1.0.1</text>
  </g>

  <!-- source chips -->
  <g font-family="'JetBrains Mono',Consolas,monospace" font-size="13.5" fill="#94a3b8" text-anchor="middle">
    <text x="600" y="330" letter-spacing="1.5">Wayback · CommonCrawl · AlienVault OTX · URLScan · VirusTotal · crt.sh · RapidDNS · HackerTarget · GitHub · Shodan</text>
  </g>
</svg>
